# ╔══════════════════════════════════════════════════════════════╗
# ║  SPECTRE MCP — Docker Compose                                ║
# ║  MCP endpoint → http://localhost:8001/sse                    ║
# ╚══════════════════════════════════════════════════════════════╝

services:
  spectre:
    build:
      context: .
      dockerfile: Dockerfile
    image: spectre-mcp:latest
    container_name: spectre-mcp

    ports:
      - "8001:8001"

    environment:
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      TOOL_TIMEOUT: "600"
      SPECTRE_PYTHON: /opt/mcp-venv/bin/python3
      SPECTRE_WORDLIST: /usr/share/wordlists/dirb/common.txt

      # ── Optional: SSE Authentication ──────────────────────────────
      # Uncomment and set a strong random string to require Bearer auth.
      # Clients must send:  Authorization: Bearer <your_key>
      #                 or  X-API-Key: <your_key>
      # SPECTRE_API_KEY: "change_me_to_a_strong_random_secret"

      # ── Optional API keys — uncomment and fill in ─────────────────
      # SHODAN_API_KEY: "your_key_here"
      # VT_API_KEY: "your_key_here"
      # ABUSEIPDB_KEY: "your_key_here"
      # ETHERSCAN_KEY: "your_key_here"

    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE

    security_opt:
      - no-new-privileges:true

    volumes:
      - spectre-output:/tmp/spectre

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ── DNS ──────────────────────────────────────────────────────────
    # These DNS settings apply to the RUNNING container only.
    # For DNS issues during 'docker compose build' (e.g. apt-get fails),
    # configure your Docker daemon DNS instead:
    # https://docs.docker.com/desktop/settings/windows/#network
    dns:
      - 8.8.8.8
      - 1.1.1.1

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M

    # ── Healthcheck ───────────────────────────────────────────────────
    # Tests that the SSE endpoint is accepting TCP connections.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',8001)); s.close()\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  spectre-output:
    driver: local
